  <style>

    .layout{max-width:1020px;margin:auto;padding:0 20px 102px}.header{display:flex;align-items:center;justify-content:space-between;padding:27px 0 20px;gap:12px}.brand{display:flex;align-items:center;gap:11px}.mark{width:41px;height:41px;display:grid;place-items:center;border-radius:13px;background:var(--lime);color:#0b1a19;font-weight:1000;font-size:22px;letter-spacing:-3px;padding-right:3px}.brand-name{font-weight:850;letter-spacing:.14em;font-size:14px}.brand-tag{font-size:11px;letter-spacing:.1em;color:var(--sub);margin-top:2px}.header-right{display:flex;align-items:center;gap:8px}.date-chip{color:var(--sub);font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--edge);padding:8px 11px;border-radius:50px}.settings{width:34px;height:34px;border:1px solid var(--edge);background:var(--panel);border-radius:50%;color:var(--ink);font-size:18px}

    h2{font-size:20px;letter-spacing:-.035em;margin:0 0 12px}h3{margin:0;font-size:16px;letter-spacing:-.015em}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.section-title h2{margin:0}.tiny{font-size:12px;color:var(--sub)}.muted{color:var(--sub)}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{border:1px solid var(--edge);border-radius:var(--r);padding:18px;background:var(--panel);min-width:0}.kpi-label{color:var(--sub);font-size:11px;letter-spacing:.055em;text-transform:uppercase;font-weight:750}.kpi-value{font-size:27px;line-height:1.15;font-weight:850;letter-spacing:-.045em;margin-top:7px}.kpi-caption{color:var(--sub);font-size:11px;margin-top:5px}.green{color:var(--lime)}.blue{color:var(--blue)}.strip{height:6px;background:#26384a;border-radius:99px;margin-top:12px;overflow:hidden}.strip span{height:100%;background:var(--lime);border-radius:99px;display:block;max-width:100%}.subsection{margin-top:22px}.list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:10px;border-bottom:1px solid var(--edge)}.list-row:last-child{border-bottom:0;padding-bottom:0}.list-row:first-child{padding-top:0}.tag{padding:5px 8px;border:1px solid var(--edge);border-radius:7px;color:var(--sub);font-size:11px;font-weight:750;white-space:nowrap}.tag.green{color:var(--lime);background:#baff730c;border-color:#5b834d}.tag.blue{color:var(--blue);background:#89d2ff0a;border-color:#456e82}.btn{background:var(--lime);border:1px solid var(--lime);color:#101b13;border-radius:11px;font-weight:850;padding:10px 14px;min-height:40px;font-size:13px;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px);background:#d0ff9e}.btn.secondary{color:var(--ink);background:var(--panel2);border-color:var(--edge)}.btn.ghost{color:var(--lime);background:#baff730d;border-color:#4d6c47}.btn.small{font-size:12px;padding:7px 10px;min-height:32px}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.pillrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.daypill{flex:1;min-width:68px;border:1px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--sub);padding:10px 8px;text-align:center;font-weight:800;font-size:12px}.daypill span{display:block;font-size:10px;font-weight:500;margin-top:4px}.daypill.active{background:var(--lime);border-color:var(--lime);color:#0b1c16}.daypill.active span{color:#244028}.daypill.rest{opacity:.64}.slot{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--edge)}.slot-time{font-size:12px;color:var(--lime);font-weight:800;font-variant-numeric:tabular-nums;min-width:49px}.slot-name{flex:1;font-weight:650;font-size:13px}.slot-note{font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}.slot-status{font-size:13px}.nav{position:fixed;bottom:0;left:0;width:100%;z-index:10;display:flex;align-items:center;justify-content:center;gap:5px;background:#0a1522ee;backdrop-filter:blur(18px);border-top:1px solid var(--edge);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.nav button{background:transparent;border:0;color:var(--sub);min-width:63px;max-width:115px;flex:1;display:grid;gap:4px;justify-items:center;font-size:11px;padding:8px 4px;border-radius:11px;font-weight:650}.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav button.active{background:#baff7314;color:var(--lime)}.view{animation:appear .2s ease}@keyframes appear{from{opacity:.72;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .exercise{border:1px solid var(--edge);background:var(--panel);border-radius:16px;padding:16px;margin:10px 0}.ex-top{display:flex;gap:14px;align-items:start;justify-content:space-between;margin-bottom:12px}.ex-num{font-size:11px;color:var(--lime);font-weight:900;margin-bottom:4px}.ex-prescription{font-size:12px;color:var(--sub);margin-top:4px}.set-head,.set-row{display:grid;grid-template-columns:42px 1fr 1fr 55px;align-items:center;gap:9px}.set-head{font-size:10px;color:var(--sub);font-weight:750;text-transform:uppercase;letter-spacing:.05em;padding:0 2px 5px}.set-row{padding:4px 0}.set-row label{font-size:12px;color:var(--sub)}.field{min-width:0;max-width:100%;width:100%;background:#0a1624;border:1px solid #2a4056;border-radius:9px;padding:9px 8px;color:var(--ink);outline:none;font-size:14px}.field:focus{border-color:var(--lime)}.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid #567083;border-radius:7px;background:#0a1624;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle}.check:checked{border-color:var(--lime);background:var(--lime)}.check:checked:after{content:'✓';color:#0b1718;font-size:16px;font-weight:900}.set-done{text-align:center}.meal-card{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--edge)}.meal-card:first-child{border-top:0;padding-top:0}.time-box{border-radius:10px;background:var(--panel2);font-size:12px;text-align:center;padding:10px 3px;font-weight:850;color:var(--blue)}.meal-card strong{display:block;font-size:14px}.meal-card p{color:var(--sub);font-size:12px;margin:4px 0}.meal-meta{color:var(--lime);font-size:11px;font-weight:750}.ingredients{background:#0a1725;border:1px solid #2a3b4d;border-radius:12px;margin-top:8px;padding:12px;color:#c5d4df;font-size:12px;line-height:1.6}.meal-checkbox{align-self:start;margin-top:16px}.notice{border:1px solid #3e5358;border-radius:12px;padding:13px 15px;background:#13252d;color:#c6dce4;font-size:12px;line-height:1.55}.notice strong{color:var(--lime)}.metric-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.label{font-weight:700;font-size:12px;color:#c9d8e5;display:block;margin-bottom:6px}.numinput{width:100%;border-radius:10px;background:#0a1624;border:1px solid #2a4056;padding:12px;color:var(--ink)}.graph{width:100%;max-width:680px;display:block;min-height:150px}.empty{color:var(--sub);padding:22px;text-align:center;font-size:13px;border:1px dashed var(--edge);border-radius:14px}.shop-group{margin-top:14px}.shop-item{padding:9px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--edge);font-size:13px}.shop-item:last-child{border-bottom:0}.shop-item.done{text-decoration:line-through;color:var(--muted)}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.fineprint{font-size:12px;line-height:1.55;color:var(--sub)}.footer{border-top:1px solid var(--edge);padding-top:20px;margin-top:25px;font-size:12px;color:var(--muted)}.help{font-size:12px;color:var(--sub);line-height:1.6}.restboard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid #435d3d;border-radius:14px;background:#15291f}.timecount{font-variant-numeric:tabular-nums;color:var(--lime);font-size:24px;font-weight:850}.hide{display:none!important}select.field{appearance:auto}input[type=date]{color-scheme:dark}::selection{background:#baff73;color:#0a1518}
    @media(max-width:700px){.layout{padding:0 13px 108px}.header{padding:18px 4px 15px}.hero{padding:24px 20px;min-height:204px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid2{grid-template-columns:1fr}.card{padding:15px}.date-chip{font-size:10px;padding:7px}.brand-name{font-size:12px}.brand-tag{font-size:9px}.meal-card{grid-template-columns:52px 1fr 28px;gap:9px}.meal-card strong{font-size:13px}.nav{gap:1px}.nav button{min-width:0}.daypill{min-width:72px}.set-head,.set-row{grid-template-columns:32px 1fr 1fr 40px;gap:6px}.exercise{padding:13px}}

  <div class="layout">

<script>
(()=>{'use strict';
 const $=id=>document.getElementById(id);const STORE='forge100-v1'; const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
 const schedule=[{time:'05:15',name:'Wake and hydrate',note:'300–500 ml water'},{time:'05:20',name:'Banana',note:'120 g · quick pre-workout energy'},{time:'05:30',name:'Leave home',note:'Gym kit already packed'},{time:'05:45',name:'Gym starts',note:'Four mornings per week'},{time:'06:35',name:'Finish training',note:'Change and freshen up'},{time:'06:45',name:'Leave gym',note:'Travel to yard'},{time:'07:45',name:'Protein oats',note:'Breakfast at the yard'},{time:'10:00',name:'Skyr and apple',note:'Morning break'},{time:'12:30',name:'Meal-prepped lunch',note:'Cool bag / fridge'},{time:'15:30',name:'Mixed nuts',note:'20 g'},{time:'16:30',name:'Finish work',note:'Home by 17:30'},{time:'18:00',name:'Dinner',note:'As per meal plan'},{time:'20:00',name:'Milk & meal prep',note:'250 ml; prepare tomorrow'},{time:'21:15',name:'Bedtime',note:'8 hours in bed'}];
 const mealsBase=[{id:'banana',time:'05:20',title:'Pre-gym banana',desc:'120 g banana',kcal:105,protein:1},{id:'oats',time:'07:45',title:'Protein overnight oats',desc:'75 g oats · 250 ml semi-skimmed milk · 25 g whey',kcal:501,protein:39},{id:'yoghurt',time:'10:00',title:'Skyr & apple',desc:'250 g plain Skyr · 150 g apple',kcal:230,protein:27},{id:'nuts',time:'15:30',title:'Mixed nuts',desc:'20 g mixed nuts',kcal:120,protein:4},{id:'milk',time:'20:00',title:'Evening milk',desc:'250 ml semi-skimmed milk',kcal:120,protein:9}];
 const lunches={wraps:{title:'Chicken & cheese wraps',desc:'140 g chicken breast · 110 g wraps · 25 g cheddar · 80 g peppers · 50 g onions · 15 g light mayo',kcal:690,protein:50},rice:{title:'Chicken rice box',desc:'170 g chicken breast · 75 g dry rice · 80 g sweetcorn · 100 g carrots · 10 g olive oil · 20 g sweet chilli',kcal:700,protein:48},bagels:{title:'Turkey & cheese bagels',desc:'160 g bagels · 130 g turkey slices · 25 g cheddar · 100 g cucumber · 15 g light mayo',kcal:720,protein:52}};
 const dinners={bolognese:{title:'Lean beef bolognese',desc:'200 g 5% beef mince · 100 g dry pasta · 200 g passata · 100 g carrots · 60 g onions · 20 g olive oil',kcal:925,protein:58},fajita:{title:'Chicken fajita rice',desc:'190 g chicken breast · 95 g dry rice · 100 g peppers · 70 g onions · 25 g cheddar · 40 g salsa · 20 g olive oil',kcal:910,protein:59},burgers:{title:'Beef burger & wedges',desc:'200 g 5% beef mince · 80 g bun · 320 g potatoes · 100 g cucumber · 20 g ketchup · 20 g olive oil',kcal:945,protein:57},pasta:{title:'Chicken pasta bake',desc:'180 g chicken breast · 100 g dry pasta · 150 g passata · 100 g carrots · 30 g cheddar · 15 g olive oil',kcal:895,protein:64},roast:{title:'Roast chicken dinner',desc:'200 g chicken breast · 350 g potatoes · 150 g carrots · 100 g sweetcorn · 25 g olive oil · 100 g prepared gravy',kcal:900,protein:59}};
 const dailyMenus=[['wraps','bolognese'],['rice','fajita'],['wraps','burgers'],['bagels','pasta'],['rice','bolognese'],['wraps','fajita'],['bagels','roast']];
 const routines={mon:{label:'Upper A · Chest, back & arms',day:0,short:'Upper A',ex:[['Machine chest press',3,'8–12','90 sec'],['Chest-supported row',3,'8–12','90 sec'],['Lat pulldown',2,'10–12','90 sec'],['Dumbbell lateral raise',2,'12–15','60 sec'],['Cable biceps curl',2,'10–15','60 sec'],['Triceps rope pushdown',2,'10–15','60 sec']]},tue:{label:'Lower A · Legs & abs',day:1,short:'Lower A',ex:[['Leg press',3,'10–12','90 sec'],['Dumbbell Romanian deadlift',2,'10','90 sec'],['Seated leg curl',2,'12','60 sec'],['Standing calf raise',3,'15','60 sec'],['Cable crunch',2,'12','60 sec']]},thu:{label:'Upper B · Shoulders & arms',day:3,short:'Upper B',ex:[['Seated shoulder press',3,'8–12','90 sec'],['Assisted pull-up',3,'8–10','90 sec'],['Incline chest press',2,'10–12','90 sec'],['Seated cable row',2,'10–12','90 sec'],['Hammer curl',2,'12','60 sec'],['Overhead triceps extension',2,'12','60 sec']]},fri:{label:'Lower B · Legs & abs',day:4,short:'Lower B',ex:[['Hack squat',3,'10','90 sec'],['Leg extension',2,'12','60 sec'],['Lying leg curl',2,'12','60 sec'],['Seated calf raise',3,'15','60 sec'],['Plank',2,'45 sec','60 sec']]}};
 const shopping=[['Protein & dairy',['Chicken breast · 1.6 kg','5% beef mince · 600 g','Turkey breast slices · 300 g','Plain Skyr · 1.75 kg','Semi-skimmed milk · 3.5 litres','Cheddar · 250 g','Whey protein · 175 g']],['Carbs & fruit',['Porridge oats · 525 g','Dry rice · 340 g','Dry pasta · 300 g','Potatoes · 700 g','Large tortilla wraps · 330 g','Bagels · 320 g','Burger bun · 1','Bananas · 7','Apples · 7']],['Vegetables',['Carrots · 650 g','Peppers · 440 g','Onions · 410 g','Cucumber · 300 g','Sweetcorn · 260 g']],['Other',['Mixed nuts · 140 g','Passata · 550 g','Olive oil · 160 g','Light mayonnaise · 75 g','Salsa · 80 g','Sweet chilli sauce · 40 g','Ketchup · 20 g','Prepared gravy · 100 g']]];
 const defaultState=()=>({startDate:dateKey(new Date()),meals:{},workouts:{},progress:{},shopping:{},customGoal:2700});
 let state;try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){state=defaultState()}let view='home',selectedDay=dayIndex(new Date()),selectedRoutine=Object.keys(routines).find(k=>routines[k].day===selectedDay)||'mon',graphMetric='weight',restEnd=0,restTick=null,alertText='';
 function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){alertText='Storage unavailable: export a backup if possible.'}}
 function dateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
 function dayIndex(d){return (d.getDay()+6)%7}
 function dateForDay(i){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-dayIndex(d)+i);return dateKey(d)}
 function dateLabel(key,short=false){const d=new Date(key+'T12:00:00');return d.toLocaleDateString('en-GB',short?{day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
 function html(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function mealsFor(i){const [l,d]=dailyMenus[i];return [mealsBase[0],mealsBase[1],mealsBase[2],{id:'lunch',time:'12:30',...lunches[l]},{...mealsBase[3]},{id:'dinner',time:'18:00',...dinners[d]},{...mealsBase[4]}]}
 function totalFor(day){return mealsFor(day).reduce((a,m)=>({kcal:a.kcal+m.kcal,protein:a.protein+m.protein}),{kcal:0,protein:0})}
 function dayMealsDone(i){return state.meals?.[dateForDay(i)]||[]}
 function sessionKey(r){return dateForDay(routines[r].day)+'|'+r}
 function workoutData(r){return state.workouts?.[sessionKey(r)]||{done:false,sets:{}}}
 function doneThisWeek(){return Object.keys(routines).filter(r=>workoutData(r).done).length}
 function previousLift(r,j){const today=dateForDay(routines[r].day);const prev=Object.entries(state.workouts||{}).filter(([key])=>key.endsWith('|'+r)&&key.slice(0,10)<today).sort((a,b)=>b[0].localeCompare(a[0]))[0];if(!prev)return '';const entries=Object.entries(prev[1]?.sets||{}).filter(([key,entry])=>key.startsWith(j+'-')&&entry?.weight!==''&&Number(entry?.weight)>0);if(!entries.length)return '';const last=entries[0][1];return ' · Last: '+Number(last.weight)+' kg'+(last.reps!==''&&last.reps!=null?' × '+Number(last.reps):'') }
 function header(title,sub){return `<div class="section-title"><div><h2>${title}</h2><div class="tiny">${sub||''}</div></div></div>`}
 function pbar(n,max){return `<div class="strip"><span style="width:${Math.min(100,Math.max(0,max?n/max*100:0))}%"></span></div>`}
 function kpibox(label,value,caption,bar){return `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-caption">${caption}</div>${bar||''}</div>`}
 function mealTabs(){return `<div class="pillrow" aria-label="Meal plan day">${DAYS.map((d,i)=>`<button data-mealday="${i}" class="daypill ${i===selectedDay?'active':''}">${d.slice(0,3)}<span>${dateLabel(dateForDay(i),true)}</span></button>`).join('')}</div>`}
 function gymTabs(){return `<div class="pillrow" aria-label="Gym session">${Object.keys(routines).map(k=>`<button data-routine="${k}" class="daypill ${k===selectedRoutine?'active':''}">${DAYS[routines[k].day].slice(0,3)}<span>${routines[k].short}</span></button>`).join('')}</div>`}
 function renderHome(){const today=dayIndex(new Date()),todays=mealsFor(today),done=dayMealsDone(today),tot=totalFor(today),consumed=todays.filter(m=>done.includes(m.id)).reduce((a,m)=>({kcal:a.kcal+m.kcal,protein:a.protein+m.protein}),{kcal:0,protein:0}),todayRoutine=Object.keys(routines).find(k=>routines[k].day===today),completed=doneThisWeek();let latest=Object.entries(state.progress||{}).sort((a,b)=>b[0].localeCompare(a[0]))[0];return `<div class="view"><section class="hero"><div class="eyebrow">12-week strength & physique plan</div><h1>BUILD THE BODY.<br>OWN THE ROUTINE.</h1><p>Beginner-friendly training and practical food built around your 05:15 starts, yard-based work and 17:30 finish.</p><div class="hero-bottom"><span class="mini-pill">6'3" · 100 kg starting point</span><span class="mini-pill">4 × 50-min gym sessions</span><span class="mini-pill">No fish</span></div></section>
 ${header('Today at a glance',dateLabel(dateKey(new Date())))}<div class="grid4">${kpibox('Calorie guide',tot.kcal.toLocaleString('en-GB'),'~'+state.customGoal+' kcal target',pbar(consumed.kcal,state.customGoal))}${kpibox('Protein guide',tot.protein+' g','190 g target',pbar(consumed.protein,190))}${kpibox('Meals logged',done.length+'/7','Today',pbar(done.length,7))}${kpibox('Gym this week',completed+'/4','Completed workouts',pbar(completed,4))}</div>
 <div class="grid2 subsection"><section class="card"><div class="row-between"><h3>${todayRoutine?'Today’s session':'Recovery day'}</h3><span class="tag ${todayRoutine?'green':'blue'}">${todayRoutine?'05:45 – 06:35':'REST'}</span></div><p class="muted" style="font-size:13px">${todayRoutine?html(routines[todayRoutine].label):'No scheduled workout. Walk, recover and keep food consistent.'}</p>${todayRoutine?`<p class="tiny">${workoutData(todayRoutine).done?'Completed ✓':'Aim to finish with time to change before 06:45.'}</p><button data-view="train" class="btn">${workoutData(todayRoutine).done?'View workout':'Log workout'} →</button>`:`<button data-view="train" class="btn secondary">View weekly workouts →</button>`}</section>
 <section class="card"><div class="row-between"><h3>Body progress</h3><span class="tag">Every 4 weeks</span></div><p class="muted" style="font-size:13px">${latest?`Latest: ${html(latest[0])} · ${latest[1].weight??'—'} kg · ${latest[1].waist??'—'} cm waist`:'Log your starting weight, waist, upper arm and thigh to track change.'}</p><button data-view="progress" class="btn secondary">Open progress tracker →</button></section></div>
 ${header('Your workday','Mon–Fri · adjustable meals & fixed commute') }<section class="card">${schedule.filter(s=>['05:15','05:20','05:30','05:45','06:35','06:45','07:45','10:00','12:30','15:30','16:30','18:00','20:00','21:15'].includes(s.time)).map(s=>`<div class="slot"><div class="slot-time">${s.time}</div><div class="slot-name">${s.name}<div class="slot-note">${s.note}</div></div></div>`).join('')}</section><div class="notice" style="margin-top:15px"><strong>Today’s priority:</strong> Stay consistent. At your mainly yard-based activity level, ~2,700 kcal is a starting estimate; review weight, waist and strength after 2–3 weeks.</div></div>`}
 function renderTrain(){const r=routines[selectedRoutine],data=workoutData(selectedRoutine),start=new Date(state.startDate+'T12:00:00'),week=Math.max(1,Math.floor((new Date()-start)/(7*864e5))+1),total=r.ex.reduce((sum,x)=>sum+(week<=2?Math.min(2,x[1]):x[1]),0),setsDone=Object.values(data.sets||{}).filter(x=>x?.done).length;return `<div class="view">${header('Your gym programme','05:45 start · aim to finish lifting by 06:35')}${gymTabs()}<div class="subsection card"><div class="row-between"><div><div class="eyebrow">${DAYS[r.day]} · ${dateLabel(dateForDay(r.day),true)}</div><h2 style="margin:8px 0 4px">${r.label}</h2><div class="tiny">${week<=2?'Week '+week+' · technique phase, 2 sets per exercise':'Week '+week+' · progressive overload'}</div></div><span class="tag ${data.done?'green':'blue'}">${data.done?'DONE':'PLANNED'}</span></div><div class="tiny" style="margin-top:12px">${setsDone}/${total} sets logged complete</div>${pbar(setsDone,total)}</div>
 <div class="restboard subsection"><div><div style="font-size:13px;font-weight:800">Rest timer <span id="timer-count" class="timecount">${restEnd?Math.max(0,Math.ceil((restEnd-Date.now())/1000))+'s':'Ready'}</span></div><div class="tiny">60 sec for small exercises · 90 sec for compounds</div></div><div style="display:flex;gap:6px"><button class="btn small secondary" data-timer="60">60s</button><button class="btn small secondary" data-timer="90">90s</button></div></div>
 <div class="section-title"><h2 style="margin:0">Exercises</h2><span class="tiny">Enter weights and reps as you train</span></div>${r.ex.map((ex,j)=>{let setCount=week<=2?Math.min(2,ex[1]):ex[1];return `<section class="exercise"><div class="ex-top"><div><div class="ex-num">EXERCISE ${String(j+1).padStart(2,'0')}</div><h3>${ex[0]}</h3><div class="ex-prescription">${setCount} sets × ${ex[2]} reps · ${ex[3]} rest${previousLift(selectedRoutine,j)}</div></div></div><div class="set-head"><div>Set</div><div>Weight (kg)</div><div>Reps</div><div>Done</div></div>${Array.from({length:setCount},(_,i)=>{const id=j+'-'+i,entry=data.sets?.[id]||{};return `<div class="set-row"><label>${i+1}</label><input class="field" data-set-field="weight" data-ex="${j}" data-set="${i}" type="number" step="0.5" min="0" value="${Number.isFinite(+entry.weight)&&entry.weight!==''&&entry.weight!=null?html(entry.weight):''}" placeholder="kg" aria-label="${html(ex[0])} set ${i+1} weight"/><input class="field" data-set-field="reps" data-ex="${j}" data-set="${i}" type="number" step="1" min="0" value="${Number.isFinite(+entry.reps)&&entry.reps!==''&&entry.reps!=null?html(entry.reps):''}" placeholder="reps" aria-label="${html(ex[0])} set ${i+1} reps"/><div class="set-done"><input class="check" type="checkbox" data-set-field="done" data-ex="${j}" data-set="${i}" ${entry.done?'checked':''} aria-label="${html(ex[0])} set ${i+1} done"/></div></div>`}).join('')}</section>`}).join('')}
 <div class="card"><p class="help">Use a weight you could still lift for 2–3 good reps at the end of each set. When you reach the top of the rep range on every set with control, increase weight slightly next time.</p><button data-action="completeWorkout" class="btn" style="width:100%">${data.done?'✓ Workout completed — tap to undo':'✓ Mark full workout complete'}</button></div><div class="notice subsection"><strong>Recovery rule:</strong> On unusually strenuous site days, reduce the session or move it. Don't sacrifice safe technique to beat the clock.</div></div>`}
 function renderEat(){const list=mealsFor(selectedDay),tot=totalFor(selectedDay),done=dayMealsDone(selectedDay),logged=list.filter(m=>done.includes(m.id)).reduce((s,m)=>s+m.kcal,0);return `<div class="view">${header('Food for muscle growth','Fish-free · only carrots, sweetcorn, peppers, cucumber & onions')}${mealTabs()}<div class="grid2 subsection"><div class="card">${kpibox('Planned intake',tot.kcal+' kcal',tot.protein+' g protein','')}</div><div class="card">${kpibox('Meals eaten',done.length+'/7',logged+' kcal checked off',pbar(done.length,7))}</div></div><div class="section-title"><h2 style="margin:0">${DAYS[selectedDay]} meals</h2><span class="tiny">Raw meat · dry rice/pasta</span></div><section class="card">${list.map(m=>`<div class="meal-card"><div class="time-box">${m.time}</div><div><strong>${m.title}</strong><div class="meal-meta">~${m.kcal} kcal · ${m.protein} g protein</div><details><summary class="tiny" style="cursor:pointer;margin-top:7px">See exact ingredients</summary><div class="ingredients">${html(m.desc)}</div></details></div><div class="meal-checkbox"><input class="check" type="checkbox" data-meal="${m.id}" ${done.includes(m.id)?'checked':''} aria-label="Mark ${html(m.title)} eaten"/></div></div>`).join('')}</section><div class="notice subsection"><strong>Meal-prep and food safety:</strong> Prepare oats the night before; keep chilled food cold during the commute. Cool cooked rice rapidly (ideally within an hour); refrigerate it for no more than 24 hours before eating, or freeze promptly. Reheat only once until steaming hot. Don't force disliked vegetables into meals.</div><div class="button-row"><button data-action="markMeals" class="btn secondary">Mark all meals eaten</button><button data-action="clearMeals" class="btn secondary">Clear day</button></div></div>`}
 function chart(metric){const data=Object.entries(state.progress||{}).sort((a,b)=>a[0].localeCompare(b[0])).filter(([d,v])=>Number.isFinite(+v[metric])&&v[metric]!==''&&v[metric]!=null).map(([d,v])=>({date:d,y:Number(v[metric])}));if(!data.length)return `<div class="empty">No ${metric} entries yet. Add a measurement to see your trend.</div>`;const w=640,h=215,pad={l:45,r:20,t:23,b:31},values=data.map(v=>v.y),lo=Math.min(...values),hi=Math.max(...values),margin=Math.max(1,(hi-lo)*.2),min=lo-margin,max=hi+margin,x=i=>pad.l+(data.length<=1?.5:i/(data.length-1))*(w-pad.l-pad.r),y=v=>pad.t+(1-(v-min)/(max-min))*(h-pad.t-pad.b),d=data.map((o,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(o.y).toFixed(1)).join(' ');const grids=Array.from({length:4},(_,i)=>{let v=min+(max-min)*i/3,yy=y(v);return `<path d="M${pad.l} ${yy}H${w-pad.r}" stroke="#304456" stroke-dasharray="4 5"/><text x="${pad.l-8}" y="${yy+4}" text-anchor="end" fill="#96aabd" font-size="12">${v.toFixed(1)}</text>`}).join('');return `<svg class="graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="${metric} progress graph">${grids}<path d="${d}" fill="none" stroke="#baff73" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${data.map((o,i)=>`<circle cx="${x(i)}" cy="${y(o.y)}" r="5" fill="#baff73" stroke="#101c2b" stroke-width="2"><title>${o.date}: ${o.y}</title></circle>`).join('')}<text x="${pad.l}" y="${h-5}" fill="#96aabd" font-size="12">${dateLabel(data[0].date,true)}</text><text x="${w-pad.r}" y="${h-5}" fill="#96aabd" font-size="12" text-anchor="end">${dateLabel(data[data.length-1].date,true)}</text></svg>`}
 function renderProgress(){const latest=Object.entries(state.progress||{}).sort((a,b)=>b[0].localeCompare(a[0]))[0];const current=state.progress?.[dateKey(new Date())]||{};const chartTabs=[['weight','Weight'],['waist','Waist'],['arm','Upper arm'],['thigh','Thigh']].map(([id,l])=>`<button class="btn small ${graphMetric===id?'':'secondary'}" data-graph="${id}">${l}</button>`).join('');return `<div class="view">${header('Track the transformation','Measure every 4 weeks · weigh 3 mornings a week')}<div class="card"><h3>Add today’s measurements</h3><div class="tiny" style="margin:4px 0 17px">${dateLabel(dateKey(new Date()))}. Leave measurements you didn't take blank.</div><div class="metric-form"><div><label class="label" for="weight">Weight (kg)</label><input type="number" min="0" step="0.1" class="numinput" id="weight" placeholder="e.g. 100.0" value="${html(current.weight??'')}" /></div><div><label class="label" for="waist">Waist at navel (cm)</label><input type="number" min="0" step="0.1" class="numinput" id="waist" placeholder="e.g. 98.0" value="${html(current.waist??'')}"/></div><div><label class="label" for="arm">Relaxed upper arm (cm)</label><input type="number" min="0" step="0.1" class="numinput" id="arm" placeholder="e.g. 34.0" value="${html(current.arm??'')}"/></div><div><label class="label" for="thigh">Mid-thigh (cm)</label><input type="number" min="0" step="0.1" class="numinput" id="thigh" placeholder="e.g. 56.0" value="${html(current.thigh??'')}"/></div></div><button data-action="saveProgress" class="btn" style="width:100%;margin-top:16px">Save today’s measurements</button></div>
 <div class="section-title"><h2 style="margin:0">Progress chart</h2><span class="tiny">${Object.keys(state.progress||{}).length} dates recorded</span></div><div class="card"><div class="button-row" style="margin:0 0 15px">${chartTabs}</div>${chart(graphMetric)}</div><div class="section-title"><h2 style="margin:0">Measurement history</h2></div><div class="card">${Object.entries(state.progress||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12).map(([d,v])=>`<div class="list-row"><span class="tiny">${dateLabel(d,true)}</span><span class="tiny">${v.weight??'—'} kg · ${v.waist??'—'} cm waist</span><button data-delete-progress="${html(d)}" class="btn small secondary" title="Delete this measurement">×</button></div>`).join('')||'<div class="empty">No measurements saved yet.</div>'}</div><div class="notice subsection"><strong>Watch the waist, not just the scale.</strong> If waist circumference drops and your lifts improve, body recomposition is working—even if body weight stays close to 100 kg.</div></div>`}
 function renderShop(){const items=shopping.flatMap(([g,a])=>a),count=items.filter(i=>state.shopping?.[i]).length;return `<div class="view">${header('Weekly shopping list','One weekly shop · 7 days of meals')}<section class="card"><div class="row-between"><h3>Basket progress</h3><strong class="green">${count}/${items.length}</strong></div>${pbar(count,items.length)}<div class="button-row"><button class="btn small secondary" data-action="copyShopping">Copy shopping list</button><button class="btn small secondary" data-action="clearShopping">Reset ticks</button></div></section>${shopping.map(([group,items])=>`<section class="card shop-group"><h3>${group}</h3>${items.map(item=>`<label class="shop-item ${state.shopping?.[item]?'done':''}"><input type="checkbox" class="check" data-shop="${html(item)}" ${state.shopping?.[item]?'checked':''}/><span>${html(item)}</span></label>`).join('')}</section>`).join('')}<div class="notice subsection"><strong>Buying tip:</strong> Quantities are how much the meals use; choose the nearest pack size. Freeze extra meat and batch-cook portions. Chicken is 1.52 kg by recipe, rounded to 1.6 kg for shopping.</div></div>`}
 function renderSettings(){return `<div class="view">${header('Settings & backup','Your data stays in this browser on this device')}<section class="card"><h3>Programme settings</h3><div style="margin-top:14px"><label class="label" for="startdate">Date you started training</label><input type="date" class="numinput" id="startdate" value="${html(state.startDate)}"/></div><div style="margin-top:12px"><label class="label" for="goal">Daily calorie target</label><input type="number" min="1500" max="5000" step="50" class="numinput" id="goal" value="${html(state.customGoal)}"/></div><button class="btn" data-action="saveSettings" style="margin-top:14px">Save settings</button></section><section class="card subsection"><h3>Data backup</h3><p class="help">Workouts, completed meals, body measurements and shopping ticks are stored locally. Export a backup before switching devices, clearing browser data or reinstalling.</p><div class="button-row"><button class="btn secondary" data-action="export">Export JSON backup</button><button class="btn secondary" data-action="import">Import backup</button></div></section><section class="card subsection"><h3>Reset app data</h3><p class="help">This permanently clears all tracked information on this device.</p><button class="btn secondary" data-action="reset">Clear all tracked data</button></section><div class="notice subsection"><strong>Home-screen installation:</strong> For Android, host this PWA on a secure HTTPS website, open it in Chrome, then choose “Add to Home screen” or “Install app”. The downloaded single HTML file also runs standalone in a browser, but may not offer standard install controls.</div></div>`}
 function render(){const map={home:renderHome,train:renderTrain,eat:renderEat,progress:renderProgress,shop:renderShop,settings:renderSettings};$('main').innerHTML=(map[view]||renderHome)();$('topdate').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});if(alertText){const div=document.createElement('div');div.className='notice';div.style.marginTop='14px';div.textContent=alertText;$('main').prepend(div);alertText=''}updateRest()}
 function updateRest(){const el=$('timer-count');if(!el)return;if(!restEnd){el.textContent='Ready';return}const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));el.textContent=left?left+'s':'Done!';if(!left){restEnd=0;clearInterval(restTick);restTick=null}}
 function show(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-mealday],[data-routine],[data-graph],[data-action],[data-timer],[data-delete-progress]');if(!b)return;
 if(b.dataset.view){show(b.dataset.view);return}if(b.dataset.mealday!==undefined){selectedDay=Number(b.dataset.mealday);render();return}if(b.dataset.routine){selectedRoutine=b.dataset.routine;render();return}if(b.dataset.graph){graphMetric=b.dataset.graph;render();return}if(b.dataset.timer){restEnd=Date.now()+Number(b.dataset.timer)*1000;clearInterval(restTick);restTick=setInterval(updateRest,250);updateRest();return}if(b.dataset.deleteProgress){if(confirm('Delete this measurement entry?')){delete state.progress[b.dataset.deleteProgress];save();render()}return}
 switch(b.dataset.action){case 'settings':show('settings');break;case 'completeWorkout':{const k=sessionKey(selectedRoutine);state.workouts[k]=state.workouts[k]||{done:false,sets:{}};state.workouts[k].done=!state.workouts[k].done;save();render();break}case 'markMeals':state.meals[dateForDay(selectedDay)]=mealsFor(selectedDay).map(m=>m.id);save();render();break;case 'clearMeals':state.meals[dateForDay(selectedDay)]=[];save();render();break;case 'saveProgress':{let entry={};for(const k of ['weight','waist','arm','thigh']){let s=$(k).value.trim();if(s!==''){let v=Number(s);if(!(v>0&&v<1000)){alert('Enter a valid '+k+' measurement.');return}entry[k]=v}}if(!Object.keys(entry).length){alert('Enter at least one measurement.');return}state.progress[dateKey(new Date())]=entry;save();alertText='Today’s measurements saved.';render();break}case 'copyShopping':{const str=shopping.map(([g,a])=>g+'\n'+a.map(i=>(state.shopping?.[i]?'[x] ':'[ ] ')+i).join('\n')).join('\n\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(str).then(()=>{alertText='Shopping list copied.';render()}).catch(()=>prompt('Copy the shopping list:',str))}else prompt('Copy the shopping list:',str);break}case 'clearShopping':if(confirm('Reset all shopping ticks?')){state.shopping={};save();render()}break;case 'saveSettings':{const d=$('startdate').value,goal=Number($('goal').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||goal<1500||goal>5000){alert('Check the start date and calorie target (1500–5000).');return}state.startDate=d;state.customGoal=goal;save();alertText='Settings saved.';render();break}case 'export':{const blob=new Blob([JSON.stringify({app:'forge100',version:1,created:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forge-100-backup-'+dateKey(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'import':$('importfile').click();break;case 'reset':if(confirm('Remove all app data? This cannot be undone.')){state=defaultState();save();show('home')}break}
 });
 document.addEventListener('change',e=>{let t=e.target;if(t.dataset.meal){let k=dateForDay(selectedDay),arr=state.meals[k]||[];state.meals[k]=t.checked?[...new Set([...arr,t.dataset.meal])]:arr.filter(id=>id!==t.dataset.meal);save();render();return}if(t.dataset.shop){state.shopping[t.dataset.shop]=t.checked;save();render();return}if(t.dataset.setField){const key=sessionKey(selectedRoutine),j=t.dataset.ex,i=t.dataset.set,id=j+'-'+i;state.workouts[key]=state.workouts[key]||{done:false,sets:{}};const entry=state.workouts[key].sets[id]||{};entry[t.dataset.setField]=t.dataset.setField==='done'?t.checked:(t.value===''?'':Number(t.value));state.workouts[key].sets[id]=entry;save();if(t.dataset.setField==='done')render();return}});
 $('importfile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{let raw=JSON.parse(await file.text());if(raw.app!=='forge100'||!raw.data||typeof raw.data!=='object')throw Error('Not a Forge 100 backup.');if(!confirm('Replace existing app data with the backup?'))return;state=Object.assign(defaultState(),raw.data);state.meals=state.meals||{};state.workouts=state.workouts||{};state.progress=state.progress||{};state.shopping=state.shopping||{};save();alertText='Backup imported successfully.';show('home')}catch(err){alert('Could not import backup: '+err.message)}finally{e.target.value=''}});
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
